# Empty means no automatic browser-cookie access. Explicit yt-dlp cookie options remain opt-in.
# Use yt-dlp's browser specification, for example firefox or chromium:/path/to/profile.
cookies_browser=
cookies_initial=no
# Updates the shared standalone yt-dlp binary. Package-manager builds should keep this off.
auto_update=no
