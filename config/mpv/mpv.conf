# Native playback with uosc and thumbfast.
vo=gpu-next
profile=high-quality

# Conservative software baseline; Ctrl+h can select hardware decoding on slower CPUs.
hwdec=no
video-sync=audio
interpolation=no
deband=yes
scale=ewa_lanczossharp
dscale=mitchell
cscale=mitchell

# Use the Wayland compositor's output color information.
icc-profile-auto=no
target-colorspace-hint=auto
target-colorspace-hint-mode=target
target-colorspace-hint-strict=yes
gamut-mapping-mode=auto

volume=100
volume-max=150

cache=yes
cache-secs=30
demuxer-max-bytes=300M
demuxer-max-back-bytes=75M

# The quality menu changes this ceiling; youtube.lua handles bounded recovery.
ytdl-format=bestvideo[height<=?2160]+bestaudio/best[height<=?2160]
ytdl-raw-options=format-sort=[res:2160,hdr:12,fps]

osc=no
osd-bar=no
osd-level=1
osd-duration=2500
osd-font-size=32
# Keep status text below uosc's top bar.
osd-margin-y=48

screenshot-format=png
screenshot-png-compression=3
screenshot-directory=~~/screenshots
screenshot-template='mpv-screenshot-%F-T%wH.%wM.%wS'
keep-open=yes
save-position-on-quit=yes
watch-later-directory=~~/watch_later
