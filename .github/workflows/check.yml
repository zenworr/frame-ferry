name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    container: archlinux:base
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - name: Install test tools
        run: pacman -Syu --noconfirm git make python uv lua luacheck mpv ffmpeg openssl curl patch nodejs npm diffutils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        run: |
          uv python install '${{ matrix.python }}'
          echo "PYTHON=$(uv python find '${{ matrix.python }}')" >> "$GITHUB_ENV"
      - run: make dev-setup
        id: dev-setup
      - run: make check
      - run: make test-player
      - if: matrix.python == '3.14'
        run: make test-slow
      - name: Test pinned player UI
        if: matrix.python == '3.14'
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          export MPV_CONFIG_DIR="$scratch/mpv"
          export XDG_CONFIG_HOME="$scratch/config" XDG_DATA_HOME="$scratch/data" XDG_STATE_HOME="$scratch/state"
          scripts/install-mpv-ui.sh
          FRAME_FERRY_UI_CONFIG="$MPV_CONFIG_DIR" make test-ui
      - if: ${{ !cancelled() && matrix.python == '3.14' && steps.dev-setup.outcome == 'success' }}
        run: make audit
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low
